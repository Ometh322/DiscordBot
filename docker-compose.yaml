services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ['python3', 'bot.py']

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - .git/
            - __pycache__/
            - data/
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: poetry.lock
