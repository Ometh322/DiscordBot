[project]
name = "discordbot"
version = "0.1.0"
description = "Жоский Гачи Бот с Трипл БАСС БУСТЕДОМ"
authors = [
    {name = "krovaves_production_destroyer"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py[voice] (>=2.6,<3)",
    "vk-api (>=11.9)",
    "yt-dlp (>=2025.10)",
    "python-dotenv (>=1.0)",
    "pysocks (>=1.7)",
    "requests (>=2.28)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
