services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: gachi-bot
    restart: unless-stopped
    # .env лежит в корне репозитория
    env_file:
      - ../.env
    volumes:
      # звуки приветствий, гифки и SQLite-каталог живут на хосте
      - ../data:/app/data
